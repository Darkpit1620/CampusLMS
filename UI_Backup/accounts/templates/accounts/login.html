
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>CampusLMS Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-box {
            background: white;
            padding: 35px;
            width: 340px;
            border-radius: 12px;
            box-shadow: 0 5px 20px #0001;
        }
        input, button {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin: 9px 0;
        }
        button {
            background: #1769cf;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>CampusLMS Login</h2>
        <p>Sign in to your learning portal</p>

        {% if form.errors %}
            <p style="color: red;">
                Invalid username or password.
            </p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <label for="id_username">Username</label>
            {{ form.username }}

            <label for="id_password">Password</label>
            {{ form.password }}

            <input type="hidden"
                   name="next"
                   value="{{ next }}">

            <button type="submit">Login</button>
        </form>

        <a href="{% url 'home' %}">
            Return to homepage
        </a>
    </div>
</body>
</html>
