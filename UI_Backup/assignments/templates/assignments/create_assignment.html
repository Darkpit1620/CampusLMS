
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Assignment | CampusLMS</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172b4d;
        }

        header {
            background: #143b70;
            color: white;
            padding: 20px 8%;
        }

        main {
            max-width: 650px;
            margin: 50px auto;
            padding: 20px;
        }

        .form-box {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0001;
        }

        input, textarea {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccd4df;
            border-radius: 6px;
        }

        label {
            font-weight: bold;
        }

        form p {
            margin-bottom: 20px;
        }

        button {
            background: #1769cf;
            color: white;
            padding: 13px 24px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        a {
            color: #1769cf;
        }
    </style>
</head>

<body>
<header>
    <h2>CampusLMS</h2>
</header>

<main>
    <h1>Create Assignment</h1>
    <p>{{ course.code }} - {{ course.title }}</p>

    <div class="form-box">
        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Create Assignment
            </button>
        </form>

        <p>
            <a href="{% url 'assignments:course_assignments' course.id %}">
                Back to Assignments
            </a>
        </p>
    </div>
</main>
</body>
</html>
